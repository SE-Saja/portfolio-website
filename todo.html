<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>To-Do App | Saja</title>
  <style>
    body { font-family: Arial, sans-serif; background: #f5f7fa; margin: 0; padding: 30px 20px; }
    .box { max-width: 500px; margin: auto; background: white; padding: 25px; border-radius: 12px; }
    h1 { color: #4a3f9f; text-align: center; }
    .row { display: flex; gap: 8px; }
    input { flex: 1; padding: 10px; border: 1px solid #ccc; border-radius: 8px; }
    button { background: #4a3f9f; color: white; border: none; padding: 10px 16px; border-radius: 8px; cursor: pointer; }
    ul { list-style: none; padding: 0; }
    li { display: flex; justify-content: space-between; align-items: center; padding: 10px; border-bottom: 1px solid #eee; cursor: pointer; }
    li.done span { text-decoration: line-through; color: #999; }
    li button { background: #d9534f; padding: 6px 10px; }
  </style>
</head>
<body>
  <div class="box">
    <h1>My To-Do List</h1>
    <div class="row">
      <input id="taskInput" type="text" placeholder="Add a new task...">
      <button onclick="addTask()">Add</button>
    </div>
    <ul id="taskList"></ul>
  </div>

  <script>
    let tasks = JSON.parse(localStorage.getItem("tasks")) || [];

    function save() {
      localStorage.setItem("tasks", JSON.stringify(tasks));
    }

    function render() {
      const list = document.getElementById("taskList");
      list.innerHTML = "";
      tasks.forEach((task, i) => {
        const li = document.createElement("li");
        if (task.done) li.className = "done";
        li.innerHTML = "<span>" + task.text + "</span>";
        li.onclick = () => { tasks[i].done = !tasks[i].done; save(); render(); };
        const del = document.createElement("button");
        del.textContent = "Delete";
        del.onclick = (e) => { e.stopPropagation(); tasks.splice(i, 1); save(); render(); };
        li.appendChild(del);
        list.appendChild(li);
      });
    }

    function addTask() {
      const input = document.getElementById("taskInput");
      const text = input.value.trim();
      if (text === "") return;
      tasks.push({ text: text, done: false });
      input.value = "";
      save();
      render();
    }

    render();
  </script>
</body>
</html>
